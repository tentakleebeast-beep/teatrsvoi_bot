# Реестр функций: экран Mini App или кнопка чата → чем это делает агент
# (карта t_09672cea, docs/development/108 §9).
#
# Зачем файл. Агент предлагал действия только там, где у него был инструмент, и молчал
# про остальное: человек не понимал, что можно посмотреть, а что — только кнопками.
# Здесь закрытый список поверхностей: у каждой записи либо tool (инструмент агента),
# либо capabilities (пункт «Что умею» — ответ строится из этого же реестра),
# либо not_for_agent с причиной. Новый экран или кнопка без записи здесь роняет
# тест tests/unit/test_agent_features.py, а не всплывает в разговоре с человеком.
#
# Правила:
#   * source — ровно адрес экрана (/webapp/...) или ровно подпись кнопки;
#   * surface — где поверхность: webapp | menu | quick | panel | chat;
#   * tool — имя из services/tool-api/app/agently/registry.py (закрытый список);
#   * not_for_agent — причина, почему агент этого не делает. Причина — для человека,
#     а не отписка: «нет права» и «пишет данные» — разные ответы.
#
# Продуктовые формулировки кнопок не переписываются: source — это их текущий текст.
# Экраны сверяются с pages.routes.build_router (экраны и старые адреса-редиректы);
# кнопки — с клавиатурами бота, включая кнопки в обычных сообщениях чата
# (/start, подсказка о вводе, фолбэк): keyboards.CHAT_BUTTONS и
# routers.menu.CHAT_ACTION_BUTTONS.
#
# Кроме объявленных списков сторож читает сами routers/menu.py и keyboards.py
# (tests/unit/button_scan.py): подпись, собранную мимо списка — литералом в обработчике,
# вычисляемым колбэком `"form:" + kind`, строкой в списковом включении, — он тоже найдёт.
# Если подпись приходит из данных (имя человека, тип операции), место описывается в
# разделе `scenarios` ниже с причиной: непроверяемых кнопок быть не должно.

version: 1

scopes:
  screens: routes.build_router
  buttons:
    - keyboards.MENU_ACTIONS
    - keyboards.DIALOG_CONTROLS
    - keyboards.panel_rows
    - keyboards.CHAT_BUTTONS
    - routers.menu.CHAT_ACTION_BUTTONS
  # Подписи, которые нельзя сверить построчно: они приходят из данных или из общего
  # построителя. Сторож (tests/unit/button_scan.py) читает routers/menu.py и
  # keyboards.py и требует, чтобы каждое такое место было описано в разделе
  # `scenarios` с причиной. Новое непроверяемое место роняет тест.
  scanned_files:
    - menu.py
    - keyboards.py
  scenarios: scenarios

# Места, где подпись кнопки приходит из данных или из общего построителя.
# Ключ — file + function + kind + expr; выражение — как оно написано в исходнике.
scenarios:
  - id: scenario.chat_actions_menu
    file: menu.py
    function: _chat_action_buttons
    kind: row
    expr: text
    reason: "общий построитель строк: подписи берутся из routers.menu.CHAT_ACTION_BUTTONS"

  - id: scenario.copy_code_rows
    file: keyboards.py
    function: copy_code_kb
    kind: "text=InlineKeyboardButton"
    expr: text
    reason: "общий построитель: подписи приходят из строк вызова, они проверяются отдельно"

  - id: scenario.rows_kb
    file: keyboards.py
    function: kb
    kind: "text=InlineKeyboardButton"
    expr: t
    reason: "общий построитель клавиатуры: подписи приходят из строк вызова"

  - id: scenario.candidates
    file: keyboards.py
    function: _candidates_kb
    kind: row
    expr: "c['display_name']"
    reason: "имя человека из БД — данные, а не текст интерфейса; кнопка выбора себя"

  - id: scenario.group_kb
    file: keyboards.py
    function: group_kb
    kind: row
    expr: text
    reason: "пункты подменю из keyboards.MENU_ACTIONS: подписи проверяются поверхностью menu"

