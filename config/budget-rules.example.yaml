# Машиночитаемый регламент бюджета.
# Читается tool-api при старте и в n8n-воркфлоу WF-03 (budget-capture).
# Это пример: категории и синонимы нужно сверить с реальным файлом бюджета.
version: 1

budget:
  spreadsheet_id: "REPLACE_ME"
  sheets:
    transactions: "Транзакции"
    directory:    "Справочники"
    dues:         "Взносы"
    summary:      "Свод"          # только чтение
  header_row: 1
  expected_headers:               # сверка при старте; расхождение => стоп + алерт
    [tx_id, Дата, Тип, Сумма, Категория, Проект, Контрагент, Назначение,
     Способ, Кто внёс, Основание, Ревизия, Статус]

parsing:
  currency: RUB
  default_timezone: GMT+4          # МСК по требованию заказчика, TZ_OFFSET_HOURS=4
  confirm_new_category: true      # неизвестная категория => вопрос
  dedupe_window_minutes: 10
  max_facts_per_message: 5
  amount_patterns:                # порядок важен: сначала "3к", потом "3 000"
    - '\b(\d+[.,]?\d*)\s*к\b'     # 3к, 1.5к  => *1000
    - '\b(\d+[.,]?\d*)\s*тыс\b'   # 1,5 тыс  => *1000
    - '(\d{1,3}(?:[ \u00A0]\d{3})+)(?:[.,]\d{1,2})?'   # 12 500
    - '(\d+(?:[.,]\d{1,2})?)\s*(?:₽|р\.|руб|рублей)?'
  date_words:
    сегодня: 0
    вчера: -1
    позавчера: -2
    завтра: 1

type_markers:
  expense: [расход, потратили, оплатили, заплатили, купили, отдали, сняли, аренда, гонорар]
  income:  [доход, приход, пришло, поступило, сдали, сдал, взнос, выручка, пожертвование]
  transfer: [перевод, перевели, с карты на карту]

methods:
  cash:     [наличные, налом, нал, кэш]
  card:     [карта, картой, с карты, эквайринг]
  transfer: [перевод, счёт, расчетный счет]

categories:
  - name: Аренда помещения
    allow_above: 1000000
    synonyms: [аренда, помещение, прачечная, коммуналка_аренда, rent]

  - name: Коммунальные платежи
    synonyms: [коммуналка, коммунальные, свет, электричество, вода, жкх, отопление]

  - name: Фото/видео
    synonyms: [фото, фотосъёмка, фотосессия, видеосъёмка, съёмка, оператор, монтаж, видеограф]
    counterparty_hints: [Зайцев]

  - name: Реквизит и декорации
    synonyms: [реквизит, декорации, бутафория, мебель, пошив декораций]

  - name: Костюмы
    synonyms: [костюм, костюмы, пошив, ткань, прокат костюмов, грим]

  - name: Производство спектакля
    synonyms: [спектакль, постановка, премьера, репетиция_выезд]

  - name: Свет и звук
    synonyms: [свет, звук, dmx, приборы, пульт, оборудование, аренда_света]

  - name: Гонорары
    synonyms: [гонорар, зарплата, оплата_труда, преподаватель]

  - name: Курсы и обучение
    synonyms: [курс, обучение, мастер-класс, преподаватель_курса]

  - name: Взносы студийцев
    direction: income
    synonyms: [взнос, взносы, членский]

  - name: Билеты
    direction: income
    synonyms: [билеты, продажа_билетов, выручка, qtickets, kassir]

  - name: Пожертвования
    direction: income
    synonyms: [пожертвование, донат, спонсор, поддержка]

  - name: Прочее
    fallback: true
    synonyms: [прочее, разное, мелочи, прочие]

# Сценарий уточнения: если найдено 2+ равнозначных категории —
# показать не более 5 кнопок, приоритет у самых частых в истории.
clarification:
  max_buttons: 5
  ask_when: [category_missing, category_ambiguous, amount_missing,
             date_in_future, date_too_old, possible_duplicate]
  after_two_failed_attempts: handoff_to_org   # запись не создаётся

notifications:
  timezone: GMT+4
  quiet_hours:
    from: "20:00"      # МСК
    to: "08:00"        # следующего дня
  daily_limit_per_user: 5
  dedupe: required
