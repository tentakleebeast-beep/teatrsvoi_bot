# Палитра календаря: какой цвет какому типу события.
# Цвета задаются НА СОБЫТИИ (colorId 1–11 из Google), потому что это единственный уровень,
# который виден всем и доступен через API. Цвет календаря целиком — личная настройка
# пользователя (calendarList), сервисная учётка её не видит и не может изменить.

timezone: Europe/Samara

# 1 Лаванда, 2 Шалфей, 3 Виноград, 4 Фламинго, 5 Банан, 6 Мандарин,
# 7 Павлин, 8 Графит, 9 Голубика, 10 Базилик (зелёный, «Авокадо»), 11 Помидор
types:
  Аренда:
    color_id: 10          # зелёный — как сейчас «Авокадо» в боевом календаре
    revenue: true         # арендатор платит студии
    duration_hours: [1.0, 1.5]
  Показ:
    color_id: 11          # красный
    revenue: true         # показ арендатора тоже доход студии
  Репетиция:
    color_id: 9           # синий
    revenue: false
  Тренинг:
    color_id: 5           # жёлтый
    revenue: false
  Служебное:
    color_id: 8           # серый
    revenue: false

# Правила отображения
rules:
  title_mask: "<Тип> - <Название>"       # «Аренда - Валерий», «Репетиция - Чёрная пурга»
  end_of_day: "23:55"                    # события «до конца дня» ставим 23:55, не 00:00
  never_end_at_midnight: true
  recurrence: weekly                     # регулярные аренды — еженедельные серии
