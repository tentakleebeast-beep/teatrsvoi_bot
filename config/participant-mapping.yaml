# Маппинг «имя в файле → участник в БД»
#
# Сверено фактом: шапка листа «студийцы» (колонки D..Q) против таблицы participant.
# Имена в файле идут в порядке «Имя Фамилия», в БД — «Фамилия Имя», отсюда пара «ё».
#
# Колонка `file` — как написано в шапке листа. Колонка `db_id` — канонический участник.
# `note` — то, что нужно решить человеку, а не агенту.

version: 1
updated: 2026-11-03
source_sheet: "Расписание студийцы / лист «студийцы»"
target_table: participant

