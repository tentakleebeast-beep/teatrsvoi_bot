rules:
  matching: "сначала точное совпадение Фамилия+Имя, затем Имя+Фамилия, затем фамилия; ё/е считается равным"
  unmatched: "новых участников импорт не создаёт — строка несовпадения уходит в отчёт"
  archived: "по умолчанию занятость архивных не импортируем; включается флагом --include-archived"
