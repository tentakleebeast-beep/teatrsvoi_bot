# Модели и деньги агентного режима (карта A-4, docs/development/108 §10).
#
# Зачем файл. Модель агентного шага выбирается по замеру, а не по цене, но сам выбор
# должен меняться без правки кода и без .env-экспериментов на сервере. Здесь три вещи,
# которые раньше жили только в голове и в отчёте: роль → модель, дневной бюджет чата
# и TTL кэша повторяющихся вопросов.
#
# Приоритет значений: переменная окружения (AGENT_MODEL, AGENT_CLASSIFIER_MODEL,
# AGENT_MAX_STEPS) → этот файл → умолчание в коде. Битый или пропавший файл сервис
# не роняет: работают умолчания, иначе агент молча уходил бы в деградацию.
#
# Цифры обоснования — docs/reports/113-agent-models-budget.md, замер — docs/reports/112.
#
# Правка этого файла не требует перезапуска: он читается при обращении, с кэшем по
# времени изменения (как config/ui-texts.yaml).

version: 1

roles:
  # Исполнитель агентного шага: у него инструменты, поэтому важны tool-calling и доля
  # неверных ответов, а не цена. Замер A-0: 11/16 на классе tool (лучший результат),
  # 13% неверных (меньше всех), p95 5,5 с. gpt-4o дороже в 16 раз и хуже (62%).
  agent:
    model: openai/gpt-4o-mini
    max_steps: 4
  # Классификатор сценария: один вызов без инструментов, ответ — одно слово.
  # gpt-4.1-nano: 0,10/0,40 $ за 1M токенов, p95 4,3 с в одиночном режиме.
  classifier:
    model: openai/gpt-4.1-nano

# Дневной бюджет одного чата. Обе цифры — предел, а не цель: при исчерпании человек
# получает ответ по правилам и строку «дальше — по кнопкам».
# Посчитано по замеру: 1085 токенов и 1,9 шага на сообщение в агентном режиме,
# значит 60 000 токенов ≈ 55 сообщений, 100 шагов ≈ 52 сообщения. Пределы срабатывают
# одновременно, поэтому один не маскирует другой.
chat_budget:
  daily_tokens: 60000
  daily_steps: 100

# Кэш ответов: только повторяющиеся вопросы, у которых ответ живёт секунды.
# Бюджет, взносы и файлы не кэшируются вовсе (default_ttl_seconds: 0): данные меняются,
# а человек увидел бы вчерашнюю цифру как сегодняшнюю.
cache:
  default_ttl_seconds: 0
  groups:
    - name: date
      ttl_seconds: 30
      patterns:
        - "какой сегодня"
        - "какое сегодня"
        - "какая сегодня"
        - "какой день недели"
        - "какая дата"
        - "какое число"
        - "который час"
        - "сколько времени"
    - name: availability
      ttl_seconds: 60
      patterns:
        - "кто сегодня занят"
        - "кто сегодня свободен"
        - "кто сейчас занят"
        - "кто занят"
        - "кто свободен"
        - "занятость на сегодня"

# Цены провайдера, $ за 1M токенов: [вход, выход] (OpenRouter, проверено 01.11.2026).
# Нужны в двух местах: scripts/agent_cost.py (отчёт о стоимости) и боевой учёт
# llm_usage (карта AUD-10) — при записи расхода цена считается по этому файлу и курсу
# ниже, поэтому отчёт и журнал не расходятся.
# Модели, которой здесь нет, цена не выдумывается: в llm_usage она пишется с
# cost_rub = NULL и price_status = 'no_price' («цены нет»), а не с нулём. Добавили модель
# в roles — добавьте её цену сюда, иначе в журнале будет дырка вместо рублей.
prices_usd_per_million:
  openai/gpt-4.1-nano: [0.10, 0.40]
  openai/gpt-4o-mini: [0.15, 0.60]
  openai/gpt-4.1-mini: [0.40, 1.60]
  openai/gpt-4o: [2.50, 10.00]

# Курс для колонки «рубли» в отчёте о стоимости. Источник указан, чтобы цифра
# проверялась, а не принималась на веру.
currency:
  usd_rub: 80.5573
  usd_rub_date: 2026-11-02
  usd_rub_source: "ЦБ РФ, XML_daily.asp на 02.11.2026"
