# Правила оформления календаря, выведенные из основного календаря «Театр-студия СВОИ»
# Срез: 26.10.2026, окно анализа: 120 дней назад — 60 вперёд, 381 событие.
# Это начальные правила. Дальше уточняются человеком и переносятся в код бота.

timezone: Europe/Samara        # GMT+3

# Как устроены записи сейчас:
format:
  title_mask: "<Тип> - <Название>"   # Аренда - Валерий, Репетиция - Чёрная пурга, Тренинг - Музыка
  recurrence: используется для регулярных аренд (RRULE:FREQ=WEEKLY по дням недели)
  colors: см. config/calendar-palette.yaml (цвет задаётся на событии, colorId 1–11)
  end_of_day: 23:55 (события «до конца дня» не заканчиваются в 00:00)
  location: не заполняется
  description: не заполняется
  attendees: не добавляются
  recurrence: не используется (все события одиночные)
  color: не используется
  title_style: короткий, без дат и времени внутри — время задаётся самим событием

# Типы событий: шаблон названия → длительность → типовые окна начала
kinds:
  rental:                       # аренда зала, самый частый тип (215 событий)
    title_patterns:
      - "Валерий Аренда"        # 194
      - "Аренда Валерий"        # 21 (тот же смысл, другой порядок слов)
      - "Валерий аренда"        # регистр нестабилен
      - "Валерий Аренда ?"
    duration_hours: [1.0, 1.5]
    start_slots: ["08:00", "09:00", "10:00", "12:00", "16:00", "18:00", "20:00"]
    note: арендатор в названии первым словом; «Аренда» — вторым или первым, оба варианта живые

  rehearsal:                    # репетиции по проектам
    title_patterns:
      - "Репа <проект> <кто>"   # Репа ЖН Наташа, Репа Бунин, Репа ЧП Саша
      - "<проект>"              # ЖН, Чёрная Пурга, И всё же
    projects: ["ЖН", "ЧП", "Бунин", "ЛитРейв"]
    duration_hours: [2.0, 4.0]
    start_slots: ["12:00", "18:00", "19:00", "20:00"]

  course:                       # занятия курсов
    title_patterns: ["КУРС"]
    duration_hours: [2.0]
    start_slots: ["18:00", "20:00"]

  own_event:                    # внутренние события студии
    title_patterns: ["СВОИ"]
    duration_hours: [2.0, 3.5, 4.0]
    start_slots: ["16:00", "18:00", "20:00"]

  show:                         # показы и вечера
    title_patterns: ["Показ аренда <кто>", "Литературный вечер", "Прогон <проект>"]
    duration_hours: [1.0, 2.0, 4.0, 5.0]
    start_slots: ["18:00", "19:00", "20:00"]

  maintenance:                  # ремонт, музыка, подготовка
    title_patterns: ["Ремонт", "КОСМИЧЕСКИЙ ремонт", "Музыка", "Подготовка к <проекту>"]
    duration_hours: [2.0, 4.0, 6.0]
    start_slots: ["10:00", "12:00", "16:00", "20:00", "22:00"]

# Нормализация для распознавания (бот приводит названия к канону)
normalize:
  "аренда валерий": "Валерий Аренда"
  "валерий аренда": "Валерий Аренда"
  "валерий аренда ?": "Валерий Аренда"
  "жн": "Репа ЖН"
  "чп": "Репа ЧП"

# Плотность недели (по анализу): Пн 70, Вт 61, Пт 69, Вс 69, Ср 48, Сб 40, Чт 24
busiest_days: ["Пн", "Пт", "Вс", "Вт"]

# Конфликты, которые бот обязан замечать
conflict_rules:
  - аренда не может пересекаться с репетицией или показом
  - репетиция проекта требует свободного зала и занятости участников
  - «Прогон» ставится не раньше чем за 3 дня до показа
  - после 23:00 события не создаются без подтверждения человека
