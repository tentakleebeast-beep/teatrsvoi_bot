# Локальное соответствие «имя в файле → человек» и подсказки категории бюджета.
#
# В репозитории живёт только этот пример с плейсхолдерами: настоящие имена участников
# в публикуемом дереве не держим (Ш-03 плана 129). Рабочий файл — `config/participant-names.yaml`
# рядом, он в `.gitignore`, и его читают скрипты и сервис, если он есть. Нет файла — работаем
# на одних данных БД, ошибки нет.
#
# На сервере тот же путь: `$SVOI_ROOT/config/participant-names.yaml`. Файл лежит поверх клона
# как неотслеживаемый, `git checkout --force FETCH_HEAD` его не удаляет — пути нет в дереве
# коммита (так же живут личные манифесты, docs/development/26 §1).

version: 1

# Никнейм листа/файла → person_key из таблицы participant (регистр, ё/е и лишние пробелы
# не важны). Нужен только для имён, которых ещё нет в person_alias: после первого импорта
# расписания скрипт сам заводит алиас «никнейм листа → человек», и строка становится лишней.
names:
  "<никнейм листа>": "<person-key>"

# Имя человека → категория бюджета, когда в строке есть только имя и сумма
# («5000 <фамилия>»). Категория — из справочника `category` (direction=expense).
# Без подсказок такие строки разбираются по словам «гонорар», «доля», «%».
category_hints:
  "<фамилия или имя, как пишут в бюджете>": "Гонорары и доли"
