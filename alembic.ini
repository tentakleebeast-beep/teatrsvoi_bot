# Alembic: учёт применённых миграций схемы БД (docs/reports/132).
#
# Единственное описание схемы — db/init/*.sql. Ревизия в
# services/tool-api/migrations/versions оборачивает ровно один файл и хранит его sha256.
# URL базы берётся из DATABASE_URL (на проде и в compose) или из config.attributes["url"]
# (тесты), поэтому sqlalchemy.url здесь намеренно пустой: второй источник адреса БД
# разъехался бы с первым.

[alembic]
# %(here)s — каталог этого файла. Пути не зависят от текущего каталога: иначе
# `alembic -c /abs/alembic.ini` из /tmp и `deploy/check_schema.py --expect-head`,
# вызванный не из корня репозитория, падают с «Path doesn't exist».
script_location = %(here)s/services/tool-api/migrations
prepend_sys_path = %(here)s
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

# Свой обработчик не назначаем: запись идёт через root. `handlers = console` здесь
# дублирует каждую строку — консоль висит и на root, а сообщение проходит по обоим.
[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
