name: деплой на прод

# Запуск только вручную, кнопкой Run workflow в GitHub. Автоматического деплоя нет:
# правило проекта — прод обновляется по команде владельца (docs/development/26 §6).
#
# Зачем через GitHub: с рабочей машины сеть до прод-сервера не проходит (узел VPN
# не достаёт адрес), а раннеры GitHub достают его напрямую. Тот же скрипт, что и руками:
# deploy/server-deploy.sh.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, например v0.3.1"
        required: true
        default: "v0.3.1"
      dry_run:
        description: "Только проверить (не менять прод)"
        type: boolean
        default: true

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: ключ и известный хост
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Диагностика: длина ключа и его тип, без самого содержимого.
          echo "секрет DEPLOY_SSH_KEY: символов ${#DEPLOY_SSH_KEY}"
          head -1 ~/.ssh/deploy_key | sed 's/\(PRIVATE KEY-----\).*/\1/'
          if [ "${#DEPLOY_SSH_KEY}" -lt 200 ]; then
            echo "Секрет пуст или это не приватный ключ. Нужен приватный ключ целиком," >&2
            echo "от -----BEGIN OPENSSH PRIVATE KEY----- до -----END OPENSSH PRIVATE KEY-----." >&2
            exit 1
          fi
          ssh-keygen -y -P "" -f ~/.ssh/deploy_key >/dev/null 2>&1 || {
            echo "Ключ защищён парольной фразой — GitHub Actions не сможет им пользоваться." >&2
            echo "Нужна копия без пароля: см. docs/infrastructure/35." >&2
            exit 1
          }
          ssh-keyscan -T 10 "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"

      - name: связь по SSH
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 \
              "root@$DEPLOY_HOST" 'echo ssh-ok; hostname' || {
            echo "SSH не прошёл: смотрите строку выше (Permission denied — ключ не тот;" >&2
            echo "timed out — порт 22 закрыт со стороны раннера)." >&2
            exit 1
          }

      - name: где на сервере лежит репозиторий
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "root@$DEPLOY_HOST" '
            echo "host: $(hostname)"; echo "uptime: $(uptime -p)";
            ls -d /opt/svoi 2>/dev/null && echo "каталог /opt/svoi есть";
            sudo -u svoi git -C /opt/svoi describe --tags --always 2>/dev/null || echo "версия не определена";
            systemctl is-active svoi-tool-api svoi-gateway 2>/dev/null | tr "\n" " "; echo
          '

      - name: проверка без изменений
        if: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # Гит трогаем только от пользователя svoi и его ключом: у root ключа GitHub нет,
          # и «Host key verification failed» — ровно этот случай.
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "root@$DEPLOY_HOST" '
            set -e
            KEY=/home/svoi/.ssh/id_ed25519
            G() { sudo -u svoi env GIT_SSH_COMMAND="ssh -i $KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" git -C /opt/svoi "$@"; }
            echo "сейчас:     $(sudo -u svoi git -C /opt/svoi describe --tags --always)"
            G fetch --tags --quiet || echo "предупреждение: теги не подтянулись"
            if sudo -u svoi git -C /opt/svoi rev-parse -q --verify "${{ inputs.tag }}" >/dev/null; then
              echo "цель:       ${{ inputs.tag }}"
              echo "коммитов:   $(sudo -u svoi git -C /opt/svoi rev-list --count HEAD..${{ inputs.tag }})"
              echo "миграций:   $(sudo -u svoi git -C /opt/svoi diff --name-only HEAD..${{ inputs.tag }} -- db/init/ | wc -l)"
            else
              echo "ЦЕЛИ НЕТ: тег ${{ inputs.tag }} не найден на сервере" >&2; exit 1
            fi
          '

      - name: выкат
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          # Важно: deploy/svoi.env задаёт SVOI_REF="main", а `units` лишь рендерит юниты.
          # Поэтому тег ставим явно от пользователя svoi, затем перезапускаем сервисы —
          # иначе на диске новый код, а в памяти старый процесс (ровно так и вышло в первый раз).
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "root@$DEPLOY_HOST" '
            set -e
            cd /opt/svoi
            KEY=/home/svoi/.ssh/id_ed25519
            S() { sudo -u svoi env GIT_SSH_COMMAND="ssh -i $KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" git -C /opt/svoi "$@"; }
            S fetch --tags --force --quiet
            S checkout --force "${{ inputs.tag }}"
            echo "на диске: $(sudo -u svoi git -C /opt/svoi describe --tags --always)"
            sudo -u svoi /opt/svoi/.venv/bin/pip install -q -r /opt/svoi/requirements.txt
            # схема проверяется до перезапуска: иначе сервис поднимается на старой схеме
            deploy/server-deploy.sh verify
            # Хранилище файлов: без него presign отвечает 503, а Mini App не грузит файлы
            # (Д-03, 09.11.2026). Шаг идемпотентен и сам дописывает STORAGE_* в .env.
            deploy/server-deploy.sh storage
            deploy/server-deploy.sh units
            systemctl restart svoi-tool-api
            systemctl restart svoi-gateway 2>/dev/null || echo "svoi-gateway не запущен — пропускаю"
            sleep 6
            deploy/server-deploy.sh smoke
          '

      - name: что установлено на сервере
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          SHA=$(ssh -i ~/.ssh/deploy_key -o BatchMode=yes "root@$DEPLOY_HOST" \
                'sudo -u svoi git -C /opt/svoi rev-parse HEAD')
          echo "WANT_SHA=$SHA" >> "$GITHUB_ENV"
          echo "на сервере: $SHA"

      - name: проверка фактом
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          curl -fsS --max-time 25 https://svoi-theater-samara.online/api/health | tee health.json
          python3 - <<'PY'
          import json, os, sys
          body = json.load(open("health.json"))
          got = body.get("git_sha", "")
          want = os.environ["WANT_SHA"]
          print(f"env={body.get('env')} в процессе={got} на диске={want} ok={body.get('ok')}")
          if body.get("env") != "prod" or not body.get("ok"):
              sys.exit("прод не подтвердил себя после выката")
          if not want.startswith(got):
              sys.exit(f"ВЕРСИЯ НЕ СОВПАЛА: сервис работает на {got}, на диске {want} — нужен перезапуск")
          print("версия совпала: сервис работает с того кода, который выложен")
          PY

      - name: откат при падении
        if: failure() && !inputs.dry_run
        run: |
          # Предыдущий тег ищем от пользователя svoi: у root нет ключа GitHub.
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "root@$DEPLOY_HOST" '
            cd /opt/svoi
            PREV=$(sudo -u svoi git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
            if [ -n "$PREV" ]; then
              echo "откат на $PREV"
              deploy/server-deploy.sh rollback "$PREV"
            else
              echo "предыдущий тег не найден — откат вручную"
            fi
          ' || echo "откат не выполнился — нужен ручной разбор"
