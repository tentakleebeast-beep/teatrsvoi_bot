name: участники из боевой БД

# Печатает участников прода: id, имя, статус, алиасы. Нужно для сверки с колонками
# в таблице «Расписание студийцы» перед импортом — чтобы не создать двойников.

on:
  workflow_dispatch:

concurrency:
  group: participants-dump
  cancel-in-progress: true

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: ключ и известный хост
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"

      - name: SQL
        run: |
          cat > /tmp/q.sql <<'SQL'
          select id, status,
                 coalesce(display_name, '-') as name,
                 coalesce(array_to_string(aliases, ','), '') as aliases
          from participant
          order by id;
          SQL

      - name: участники
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "root@$DEPLOY_HOST" 'cat > /tmp/q.sql' < /tmp/q.sql
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 "root@$DEPLOY_HOST" \
            'docker exec -i svoi-postgres psql -U svoi -d svoi -A -F "|" -f /dev/stdin < /tmp/q.sql' | head -40
