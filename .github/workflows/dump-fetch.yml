name: копия дампа с прода

# Отдаёт последний ежедневный дамп базы артефактом GitHub.
#
# Зачем: с рабочей машины прод недоступен (docs/infrastructure/35), а стенду нужна копия
# данных. Решение владельца V-041 (08.11.2026): источник — последний ежедневный дамп с
# сервера, писать в копию можно, после прохода копия выбрасывается (docs/development/141 §5.2).
#
# Только чтение: на сервере ничего не меняется и не удаляется, дамп остаётся на месте.
# Артефакт лежит 1 день по умолчанию: это копия боевых данных, держать её дольше незачем.
#
# Запуск: gh workflow run dump-fetch.yml
# Забрать: gh run download --name dump --dir /tmp/dump

on:
  workflow_dispatch:
    inputs:
      keep_days:
        description: "Сколько дней хранить артефакт (1-3)"
        required: false
        default: "1"

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ключ и известный хост
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '129.101.126.208' }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"

      - name: последний дамп
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 "root@$DEPLOY_HOST" \
            'ls -1t /opt/svoi/backups/svoi_*.dump 2>/dev/null | head -1' > newest.txt
          [ -s newest.txt ] || { echo "на сервере нет ни одного дампа: смотри svoi-backup.timer" >&2; exit 1; }
          NAME=$(cat newest.txt)
          echo "$NAME" | grep -Eq '^/opt/svoi/backups/svoi_[0-9-]+_[0-9]+\.dump$' \
            || { echo "неожиданное имя дампа: $NAME" >&2; exit 1; }
          echo "дамп: $NAME"
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 "root@$DEPLOY_HOST" \
            "cat '$NAME'" > dump.dump
          ls -l dump.dump
          sha256sum dump.dump | tee dump.sha256
          # Дамп обязан читаться восстановителем, иначе артефакт бесполезен.
          pg_restore -l dump.dump | head -3
          date -u +"снят: %Y-%m-%dT%H:%MZ" | tee fetched_at.txt

      - uses: actions/upload-artifact@v4
        with:
          name: dump
          path: |
            dump.dump
            dump.sha256
            newest.txt
            fetched_at.txt
          retention-days: ${{ inputs.keep_days }}
