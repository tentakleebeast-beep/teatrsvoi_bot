name: участники из БД

# Печатает участников прод-базы для сверки с именами в файле расписания.
# Только чтение: id, отображаемое имя, статус, алиасы.

on:
  workflow_dispatch:

concurrency:
  group: people-map
  cancel-in-progress: true

jobs:
  people:
    runs-on: ubuntu-latest
    steps:
      - name: ключ и известный хост
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"

      - name: список
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 "root@$DEPLOY_HOST" \
            "docker exec -i svoi-postgres psql -U svoi -d svoi -A -F '|' -c 'select id, display_name, status, coalesce(aliases::text, chr(45)) from participant order by id'"
