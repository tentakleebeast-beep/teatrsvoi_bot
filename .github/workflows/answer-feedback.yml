name: ответ на обращение

# Записывает разбор обращения в прод: журнал feedback_answer + статус feedback.
# Нужно потому, что разбор с рабочей машины не проходит (нет сети до прода), а
# обращение не должно висеть в статусе new, пока владелец ждёт ответа.

on:
  workflow_dispatch:
    inputs:
      feedback_id:
        description: "Номер обращения (feedback.id)"
        required: true
      status:
        description: "seen | planned | done | rejected"
        required: true
        default: "seen"
      text:
        description: "Текст ответа автору"
        required: true
      question:
        description: "Номер вопроса V-NNN, если ответ — вопрос"
        required: false
        default: ""

concurrency:
  group: answer-feedback
  cancel-in-progress: false

jobs:
  answer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ключ и известный хост
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"

      - name: доставить скрипт
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 "root@$DEPLOY_HOST" \
            'cat > /tmp/answer_feedback.py' < scripts/ops/answer_feedback.py

      - name: записать разбор
        env:
          FID: ${{ inputs.feedback_id }}
          STATUS: ${{ inputs.status }}
          TEXT: ${{ inputs.text }}
          QID: ${{ inputs.question }}
        run: |
          set -euo pipefail
          printf '%s' "$TEXT" | ssh -i ~/.ssh/deploy_key -o BatchMode=yes "root@$DEPLOY_HOST" \
            "cat > /tmp/fb_text"
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 "root@$DEPLOY_HOST" \
            "set -eu
             sudo -u svoi bash -c 'set -a; . /opt/svoi/.env; set +a; \
               /opt/svoi/.venv/bin/python /tmp/answer_feedback.py --id $FID --status $STATUS \
                 --question '${QID}' < /tmp/fb_text'
             rm -f /tmp/fb_text /tmp/answer_feedback.py"
