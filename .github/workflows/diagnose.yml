name: диагностика прода

# Только чтение: ничего не меняет на сервере, не перезапускает юниты, не печатает
# значений секретов — лишь наличие переменных, состояние схемы и хвосты журналов.
#
# Зачем: с рабочей машины сеть до прод-сервера не проходит (ТСПУ), а раннер GitHub
# достаёт его напрямую. Когда прод ведёт себя не так, как ожидалось, нужен способ
# посмотреть факты, не выкатывая новый код.

on:
  workflow_dispatch:
    inputs:
      lines:
        description: "Сколько строк журнала забирать с юнита"
        required: false
        default: "120"

concurrency:
  group: diagnose-prod
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: ключ и известный хост
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"

      - name: файл проверки
        run: |
          cat > /tmp/check.py <<'PY'
          import os, psycopg
          url = os.environ.get("DATABASE_URL", "")
          tail = url.split("@")[-1] if "@" in url else "не задана"
          print("БД приложения:", tail)
          if url:
              with psycopg.connect(url) as c:
                  cols = [r[0] for r in c.execute(
                      "select column_name from information_schema.columns where table_name = %s",
                      ("intent_log",)).fetchall()]
                  print("intent_log: колонок", len(cols), "| steps:", "steps" in cols)
                  if "steps" not in cols:
                      print("колонки:", ",".join(cols))
                  tabs = [r[0] for r in c.execute(
                      "select tablename from pg_tables where schemaname = 'public' "
                      "and tablename in ('agent_session','agent_confirmation')").fetchall()]
                  print("таблицы агента:", ",".join(tabs) or "нет")
          key = os.environ.get("LLM_API_KEY") or os.environ.get("OPENROUTER_API_KEY") or ""
          bad = [i for i, ch in enumerate(key) if ord(ch) > 127]
          print("ключ: длина", len(key), "| не-ASCII:", len(bad), "| позиции:", bad[:8])
          print("ключ начинается с:", (key[:3] + "***") if key else "пусто")
          PY

      - name: база, которой пользуется приложение, и чистота ключа
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 "root@$DEPLOY_HOST" \
            'sudo -u svoi bash -l -c "set -a; . /opt/svoi/.env; set +a; /opt/svoi/.venv/bin/python -"' \
            < /tmp/check.py

      - name: юниты и наличие переменных
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 "root@$DEPLOY_HOST" '
            set -u
            echo "== юниты =="
            for u in svoi-tool-api svoi-gateway svoi-backup.timer; do
              printf "%s: %s\n" "$u" "$(systemctl is-active "$u" 2>/dev/null || echo нет)"
            done
            echo
            echo "== .env: наличие переменных (значения не печатаются) =="
            for k in TELEGRAM_TOKEN ADMIN_CHAT_ID LLM_API_KEY WEBAPP_SECRET TOOL_API_TOKEN DATABASE_URL; do
              if sudo -u svoi grep -q "^$k=." /opt/svoi/.env 2>/dev/null; then echo "$k: задана"; else echo "$k: ПУСТАЯ или отсутствует"; fi
            done
            echo
            echo "== процессы бота и api =="
            ps -eo pid,lstart,cmd --sort=start_time 2>/dev/null | grep -E "tg-gateway|app\.main|uvicorn" | grep -v grep | tail -6
          '

      - name: журналы (маскируются длинные токены)
        env:
          LINES: ${{ inputs.lines }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 "root@$DEPLOY_HOST" "
            mask() { sed -E 's/[A-Za-z0-9_-]{24,}/<masked>/g'; }
            echo '== tool-api: последние ошибки =='
            journalctl -u svoi-tool-api -n ${LINES} --no-pager 2>/dev/null \
              | grep -iE 'error|warning|traceback|llm|model|429|401|403|500|agent|step' | tail -40 | mask
            echo
            echo '== gateway: последние ошибки =='
            journalctl -u svoi-gateway -n ${LINES} --no-pager 2>/dev/null \
              | grep -iE 'error|warning|traceback|llm|model|429|401|403|agent|miniapp|webapp|conflict' | tail -30 | mask
          "

      - name: топология базы
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 "root@$DEPLOY_HOST" '
            echo "== порты 5432/5433 =="
            ss -ltnp 2>/dev/null | grep -E ":543[0-9]" | head -5
            echo
            echo "== контейнеры =="
            docker ps --format "{{.Names}} {{.Status}} {{.Ports}}" 2>/dev/null | head -6
            echo
            echo "== выбор контейнера в deploy =="
            grep -n "SVOI_PG_CONTAINER=" /opt/svoi/deploy/lib.sh | head -3
            echo
            echo "== есть ли steps в контейнерной базе =="
            docker exec svoi-postgres psql -U svoi -d svoi -tAc "select count(*) from information_schema.columns where table_name='"'"'intent_log'"'"' and column_name='"'"'steps'"'"'" 2>&1 | tail -2
          '

      - name: проверка модели (агент отвечает моделью, а не правилами)
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 "root@$DEPLOY_HOST" '
            sudo -u svoi bash -l -c '"'"'
              set -a; . /opt/svoi/.env; set +a
              PORT=$(ss -ltnp 2>/dev/null | grep -oE "127\.0\.0\.1:(8[0-9]{3})" | head -1 | cut -d: -f2)
              echo "порт tool-api: ${PORT:-не найден}"
              curl -s -m 40 -X POST "http://127.0.0.1:${PORT}/tools/agent/ask" \
                -H "Authorization: Bearer $TOOL_API_TOKEN" \
                -H "content-type: application/json" \
                -H "X-Actor-Chat-Id: $ADMIN_CHAT_ID" \
                -d "{\"text\":\"сколько человек в труппе\"}" \
                | head -c 500
              echo
            '"'"'
          '

      - name: скрипт проверки провайдера
        run: |
          cat > /tmp/prov.sh <<'SH'
          set -a; . /opt/svoi/.env; set +a
          BASE=${LLM_BASE_URL:-https://openrouter.ai/api/v1}
          MODEL=${LLM_MODEL:-${ASSISTANT_MODEL:-nope}}
          echo "база: $BASE | модель: $MODEL"
          CODE=$(curl -s -o /tmp/llm.out -w "%{http_code}" -m 25 -X POST "$BASE/chat/completions" \
            -H "Authorization: Bearer $LLM_API_KEY" -H "content-type: application/json" \
            -d "{\"model\":\"$MODEL\",\"messages\":[{\"role\":\"user\",\"content\":\"скажи ок\"}],\"max_tokens\":5}")
          echo "ответ провайдера: $CODE"
          head -c 300 /tmp/llm.out | sed -E 's/[A-Za-z0-9_-]{24,}/<masked>/g'
          echo
          SH

      - name: что отвечает провайдер
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 "root@$DEPLOY_HOST" \
            'cat > /tmp/prov.sh' < /tmp/prov.sh
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 "root@$DEPLOY_HOST" \
            'chmod 755 /tmp/prov.sh && sudo -u svoi bash /tmp/prov.sh'

      - name: сверка схемы с db/init
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 "root@$DEPLOY_HOST" \
            'sudo -u svoi bash -c "set -a; . /opt/svoi/.env; set +a; /opt/svoi/.venv/bin/python /opt/svoi/deploy/check_schema.py --files"' \
            | tail -25 || true

      - name: последние обращения (обратная связь)
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 "root@$DEPLOY_HOST" \
            'docker exec -i svoi-postgres psql -U svoi -d svoi -A -F "|" -c "select f.id, f.kind, f.status, to_char(f.created_at, '"'"'DD.MM HH24:MI'"'"'), (select count(*) from feedback_answer a where a.feedback_id = f.id) as answers, left(btrim(f.text), 200) from feedback f order by f.id desc limit 5"' \
            | head -12

      - name: запросы mini app и их коды
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 "root@$DEPLOY_HOST" \
            'journalctl -u svoi-tool-api -n 400 --no-pager 2>/dev/null | grep -E "/webapp" | tail -25 | sed -E "s/^[A-Za-z]+ [0-9]+ [0-9:]+ [^ ]+ //"' \
            | head -25

      - name: маяк глазами журнала
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 "root@$DEPLOY_HOST" \
            'journalctl -u svoi-tool-api --since "-40 min" --no-pager 2>/dev/null | grep -E "boot:" | tail -12' \
            | sed -E 's/^[A-Za-z]+ [0-9]+ [0-9:]+ [^ ]+ //' | head -14

      - name: запросы с устройств (nginx)
        run: |
          set -uo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 "root@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set +e
          LOG=$(ls -1t /var/log/nginx/*access*.log 2>/dev/null | head -1)
          echo "журнал: ${LOG:-нет nginx}"
          if [ -n "$LOG" ]; then
            echo "== всего строк: $(wc -l < "$LOG") =="
            echo "== последние 5 обращений к /webapp =="
            grep -a "/webapp" "$LOG" | tail -5 | cut -c1-190
            echo "== коды по /webapp =="
            grep -a "/webapp" "$LOG" | awk '{print $9}' | sort | uniq -c | sort -rn | head -5
            echo "== кто приходит (первые 40 символов UA) =="
            grep -a "/webapp" "$LOG" | sed -E 's/.*"(Mozilla|Telegram)[^"]*".*/\1/' | sort | uniq -c | head -3
          fi
          echo "== что слушает порты =="
          ss -ltnp 2>/dev/null | head -12
          echo "== caddy: обращения к /webapp =="
          journalctl -u caddy --since '-90 min' --no-pager 2>/dev/null | grep -a '/webapp' | tail -10 | cut -c1-220
          echo "== caddy: клиенты по /webapp =="
          journalctl -u caddy --since '-90 min' --no-pager 2>/dev/null | grep -a '/webapp' | grep -aoE '(Telegram|iPhone|Android|Mozilla|okhttp)[^\"]{0,40}' | sort | uniq -c | sort -rn | head -5
          REMOTE

      - name: все обращения за последние 20 минут
        run: |
          set -uo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 "root@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set +e
          echo "== запросы к tool-api за 20 мин (любые) =="
          journalctl -u svoi-tool-api --since '-20 min' --no-pager 2>/dev/null | grep -aE '"(GET|POST) ' | tail -20 | cut -c1-160
          echo
          echo "== сколько всего за 20 мин =="
          journalctl -u svoi-tool-api --since '-20 min' --no-pager 2>/dev/null | grep -ac '"(GET|POST) '
          REMOTE

      - name: куда Caddy проксирует
        run: |
          set -uo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 "root@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set +e
          echo "== конфиг Caddy =="
          for f in /etc/caddy/Caddyfile /opt/caddy/Caddyfile /etc/caddy/Caddyfile.d/*; do
            [ -f "$f" ] && { echo "--- $f"; grep -vE '^\s*#' "$f" | grep -E 'reverse_proxy|handle|file_server|root' | head -12; }
          done
          echo
          echo "== кто слушает 8000/8001/8080 =="
          ss -ltnp 2>/dev/null | grep -E ':(8000|8001|8080|3000)\b' | cut -c1-160
          echo
          echo "== python-процессы с uvicorn/gunicorn =="
          ps -eo pid,lstart,cmd 2>/dev/null | grep -E 'uvicorn|gunicorn|app.main' | grep -v grep | cut -c1-160 | head -6
          REMOTE

      - name: аудит данных (строки, а не схема)
        run: |
          set -uo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 "root@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set +e
          Q() { docker exec -i svoi-postgres psql -U svoi -d svoi -A -F '|' -c "$1" 2>&1 | head -8; }
          echo "== бюджет: всего и диапазон =="
          Q "select count(*) as raw, count(distinct (ts::date, amount, coalesce(category,''), coalesce(note,''))) as uniq, min(ts::date), max(ts::date) from budget_tx"
          echo "== бюджет: возможные дубли (дата+сумма+статья) =="
          Q "select ts::date, amount, coalesce(category,''), count(*) from budget_tx group by 1,2,3 having count(*)>1 order by 4 desc limit 5"
          echo "== занятость: строки и диапазон =="
          Q "select count(*) as rows, count(distinct (participant_id, day, hour)) as uniq_keys, min(day), max(day) from availability_hour"
          echo "== занятость: дубли ключа =="
          Q "select participant_id, day, hour, count(*) from availability_hour group by 1,2,3 having count(*)>1 order by 4 desc limit 5"
          echo "== занятость: ноябрь =="
          Q "select count(*) from availability_hour where day >= '2026-11-01'"
          REMOTE

      - name: health снаружи
        run: |
          set -euo pipefail
          curl -fsS --max-time 25 https://svoi-theater-samara.online/api/health | head -c 400
          echo
