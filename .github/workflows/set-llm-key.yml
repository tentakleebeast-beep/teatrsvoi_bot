name: ключ провайдера на прод

# Записывает значение секрета LLM_API_KEY в /opt/svoi/.env и перезапускает tool-api.
# Значение не печатается: в логах только длина и число не-ASCII символов.
#
# Зачем: 01.11.2026 на проде в LLM_API_KEY лежал комментарий («# к…», 31 не-ASCII
# символ из 58). httpx не может положить такой заголовок в запрос:
#   UnicodeEncodeError: 'ascii' codec can't encode characters
# поэтому каждый свободный вопрос уходил в деградацию «модель недоступна».
#
# Как пользоваться: Settings → Secrets and variables → Actions → New secret,
# имя LLM_API_KEY, значение — настоящий ключ провайдера (латиница и цифры, без
# кавычек и переводов строк). Затем Run workflow с confirm=apply.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Напишите apply, чтобы записать ключ в .env и перезапустить tool-api"
        required: true
        default: ""

concurrency:
  group: set-llm-key
  cancel-in-progress: false

jobs:
  set-key:
    runs-on: ubuntu-latest
    if: inputs.confirm == 'apply'
    steps:
      - uses: actions/checkout@v4

      - name: проверить секрет
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${LLM_API_KEY:-}" ]; then
            echo "Секрет LLM_API_KEY не задан в настройках репозитория — записывать нечего." >&2
            exit 1
          fi
          if printf '%s' "$LLM_API_KEY" | LC_ALL=C grep -qP '[^\x00-\x7F]'; then
            echo "В секрете есть не-ASCII символы — такой ключ снова уронит заголовок Authorization." >&2
            exit 1
          fi
          echo "секрет найден: длина ${#LLM_API_KEY}, только ASCII"

      - name: ключ и известный хост
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"

      - name: доставить скрипт и значение
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 "root@$DEPLOY_HOST" \
            'cat > /tmp/set_env_key.py' < scripts/ops/set_env_key.py
          printf '%s' "$LLM_API_KEY" | ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
            "root@$DEPLOY_HOST" 'umask 077; cat > /tmp/newkey'

      - name: записать в .env и перезапустить
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 "root@$DEPLOY_HOST" '
            set -eu
            /opt/svoi/.venv/bin/python /tmp/set_env_key.py \
              --env /opt/svoi/.env --name LLM_API_KEY --value-file /tmp/newkey
            rm -f /tmp/newkey /tmp/set_env_key.py
            chown svoi:svoi /opt/svoi/.env && chmod 600 /opt/svoi/.env
            systemctl restart svoi-tool-api && sleep 4 && systemctl is-active svoi-tool-api
          '

      - name: проверить снаружи
        run: |
          set -euo pipefail
          curl -fsS --max-time 25 https://svoi-theater-samara.online/api/health | head -c 300
          echo
