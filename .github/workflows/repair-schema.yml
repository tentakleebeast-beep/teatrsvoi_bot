name: ремонт схемы прода

# Только DDL из репозитория: применяет указанные миграции к боевой базе,
# доводит учёт версии (alembic_version) и перезапускает tool-api. Ничего не удаляет
# и не переписывает данные.
#
# Зачем отдельным workflow: обычный деплой миграции НЕ накатывает (в server-deploy.sh
# это команда db/--migrate), поэтому схема на проде отстаёт от кода.
#
# Файлы берутся из checkout раннера, а не из /opt/svoi: на сервере лежит прошлый тег,
# новых миграций там ещё нет. По той же причине и alembic берётся из checkout раннера:
# psql про Alembic не знает, и 08.11.2026 после наката 061 структура на проде была
# впереди, а alembic_version — на 060. Выкат v0.8.0 упал на сверке версии и откатился.
# Теперь после наката структура сверяется с db/init, и только потом версия ставится
# на ревизию применённых файлов (`check_schema.py --stamp-head`).
#
# Пустой список файлов — только проверка состояния, база не меняется.
# Запуск кнопкой Run workflow с явным подтверждением.

on:
  workflow_dispatch:
    inputs:
      files:
        description: "Файлы миграций через пробел, от корня репозитория (пусто — только проверка)"
        required: false
        default: ""
      confirm:
        description: "Напишите apply, чтобы применить миграции"
        required: true
        default: ""

concurrency:
  group: repair-schema
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    if: inputs.confirm == 'apply' || inputs.files == ''
    steps:
      - uses: actions/checkout@v4

      - name: ключ и известный хост
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"

      - name: применить миграции
        env:
          FILES: ${{ inputs.files }}
        run: |
          set -euo pipefail
          if [ -z "${FILES// /}" ]; then
            echo "файлов не задано: только проверка состояния, база не меняется"
            exit 0
          fi
          for f in $FILES; do
            [ -f "$f" ] || { echo "нет файла в репозитории: $f" >&2; exit 1; }
            echo "— $f"
            ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 "root@$DEPLOY_HOST" \
              'docker exec -i svoi-postgres psql -U svoi -d svoi -v ON_ERROR_STOP=1 -q' < "$f"
            echo "  применено"
          done

      - name: копия схемы и Alembic на сервер
        # На сервере прошлый тег: новых ревизий в /opt/svoi ещё нет, поэтому цепочка
        # и alembic.ini едут из checkout раннера во временный каталог с той же
        # раскладкой (дерево читается по относительным путям, как в репозитории).
        run: |
          set -euo pipefail
          tmp=/tmp/svoi-schema-repair
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 "root@$DEPLOY_HOST" \
            "rm -rf '$tmp' && mkdir -p '$tmp'"
          tar -cf - alembic.ini db/init deploy/check_schema.py services/tool-api/migrations \
            | ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 "root@$DEPLOY_HOST" \
                "tar -xf - -C '$tmp'"
          echo "SCHEMA_DIR=$tmp" >> "$GITHUB_ENV"

      - name: учёт версии схемы (alembic current = head)
        if: inputs.files != ''
        env:
          FILES: ${{ inputs.files }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 "root@$DEPLOY_HOST" \
            "cd '$SCHEMA_DIR' && /opt/svoi/.venv/bin/python deploy/check_schema.py \
               --stamp-head --env-file /opt/svoi/.env --files '$FILES'"

      - name: версия схемы равна head
        # Явная проверка, из-за отсутствия которой 08.11.2026 откатился выкат.
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 "root@$DEPLOY_HOST" \
            "cd '$SCHEMA_DIR' && /opt/svoi/.venv/bin/python deploy/check_schema.py \
               --expect-head --env-file /opt/svoi/.env" \
            || { echo "ОШИБКА: alembic_version не равен head — следующий выкат остановится" >&2; \
                 echo "на сервере: sudo deploy/server-deploy.sh db (alembic upgrade head)" >&2; \
                 exit 1; }

      - name: состояние схемы
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 "root@$DEPLOY_HOST" \
            'docker exec -i svoi-postgres psql -U svoi -d svoi -q' < scripts/ops/schema_facts.sql

      - name: перезапустить tool-api и проверить
        if: inputs.files != ''
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 "root@$DEPLOY_HOST" \
            'systemctl restart svoi-tool-api && sleep 4 && systemctl is-active svoi-tool-api'
          sleep 3
          curl -fsS --max-time 25 https://svoi-theater-samara.online/api/health | head -c 300
          echo
